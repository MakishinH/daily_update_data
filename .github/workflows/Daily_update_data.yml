name: Update Daily Finance Data

on:
  schedule:
    # 台灣時間週一至週六 06:00 與週一至週五 18:00
    # 換算為 UTC (減 8 小時): 22:00 (前一日) 與 10:00
    - cron: '0 7,22 * * 0-5'
  workflow_dispatch: # 支援手動觸發測試

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予寫入權限以便提交檔案

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行資料抓取
        run: python main.py

      - name: 提交並推送更新
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add daily_update.json
          git commit -m "Auto update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || exit 0
          git push
